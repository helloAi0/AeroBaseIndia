name: AeroBase India CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  BUILD_DIR: build
  DB_NAME: aerobase_test
  DB_USER: postgres
  DB_PASS: postgres

jobs:
# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Build & Compile
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build C++ Backend
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake build-essential libssl-dev \
            libpqxx-dev libpq-dev libjsoncpp-dev \
            uuid-dev libhiredis-dev \
            libjwt-cpp-dev zlib1g-dev

      - name: Install Drogon
        run: |
          git clone https://github.com/drogonframework/drogon.git ~/drogon
          cd ~/drogon && git submodule update --init
          mkdir build && cd build
          cmake .. -DBUILD_REDIS=ON
          make -j$(nproc)
          sudo make install

      - name: Configure CMake
        run: cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerobase-binary
          path: build/AeroBaseIndia
          retention-days: 5

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2: Test
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-22.04
    needs: build

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aerobase_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: aerobase-binary
          path: build/

      - name: Run migrations
        run: |
          chmod +x build/AeroBaseIndia
          for f in $(ls migrations/*.sql | sort); do
            psql -h localhost -U postgres -d aerobase_test -f "$f" 2>/dev/null || true
          done
        env:
          PGPASSWORD: postgres

      - name: Start server
        run: |
          cp build/config.json build/config.json.bak 2>/dev/null || true
          cat > build/config.json << EOF
          {
            "listeners":[{"address":"0.0.0.0","port":8080}],
            "db_clients":[{
              "rdbms":"postgresql","host":"127.0.0.1","port":5432,
              "dbname":"aerobase_test","user":"postgres","passwd":"postgres",
              "connection_number":5,"name":"default"
            }],
            "redis_clients":[{
              "host":"127.0.0.1","port":6379,"name":"default"
            }],
            "threads_num":4
          }
          EOF
          cd build && ./AeroBaseIndia &
          sleep 3

      - name: Health check test
        run: |
          response=$(curl -s http://localhost:8080/health)
          echo "Health: $response"
          echo "$response" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'healthy', f'Health check failed: {d}'
          print('HEALTH CHECK PASSED')
          "

      - name: API smoke tests
        run: |
          # Test flights endpoint
          curl -sf http://localhost:8080/flights -H "X-Tenant-ID: TEST" > /dev/null
          echo "Flights API: PASS"

          # Test GraphQL
          curl -sf -X POST http://localhost:8080/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{ healthStatus { api } }"}' > /dev/null
          echo "GraphQL API: PASS"

          # Test metrics
          curl -sf http://localhost:8080/metrics > /dev/null
          echo "Metrics API: PASS"

          # Test payment order
          curl -sf -X POST http://localhost:8080/payments/order \
            -H "Content-Type: application/json" \
            -H "X-Tenant-ID: TEST" \
            -d '{"invoice_id":"TEST-001","amount":999,"gateway":"razorpay"}' > /dev/null
          echo "Payment API: PASS"

          echo "ALL SMOKE TESTS PASSED"

      - name: ML service test
        run: |
          cd ml_service && pip install -r requirements.txt -q
          python3 -c "from app import app; print('ML Service: PASS')"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3: Docker Build
# ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aerobase-india:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aerobase-india:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ML service
        uses: docker/build-push-action@v5
        with:
          context: ./ml_service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aerobase-ml:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aerobase-ml:${{ github.sha }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4: Deploy to Kubernetes
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-22.04
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Update image tags
        run: |
          cd deploy/k8s
          sed -i "s|aerobase-india:latest|aerobase-india:${{ github.sha }}|g" \
            backend-deployment.yaml
          sed -i "s|aerobase-ml:latest|aerobase-ml:${{ github.sha }}|g" \
            ml-cronjob.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f deploy/k8s/configmap.yaml
          kubectl apply -f deploy/k8s/secrets.yaml
          kubectl apply -f deploy/k8s/postgres.yaml
          kubectl apply -f deploy/k8s/redis.yaml
          kubectl apply -f deploy/k8s/backend-deployment.yaml
          kubectl apply -f deploy/k8s/backend-service.yaml
          kubectl apply -f deploy/k8s/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/aerobase-backend --timeout=120s

      - name: Post-deploy health check
        run: |
          EXTERNAL_IP=$(kubectl get svc aerobase-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl -sf "http://$EXTERNAL_IP/health" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'healthy'
          print('PRODUCTION HEALTH: OK')
          "
