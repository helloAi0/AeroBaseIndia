
worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # Frontend
    server {
        listen 80;
        server_name aerobase.in www.aerobase.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name aerobase.in www.aerobase.in;

        ssl_certificate     /etc/letsencrypt/live/aerobase.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aerobase.in/privkey.pem;

        root /var/www/aerobase/dist;
        index index.html;

        # React SPA — all routes to index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Static assets — long cache
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API proxy to Drogon backend
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # CORS
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Tenant-ID";
        }

        # ML service proxy
        location /ml/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_http_version 1.1;
        }
    }
}
