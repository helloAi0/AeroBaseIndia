# TEMPLATE ONLY. Do not apply as-is: the backend refuses to start in production with a placeholder JWT_SECRET.
# Create the real secret out-of-band instead of committing values:
#   kubectl -n aerobase create secret generic aerobase-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" --from-literal=DB_PASSWORD='<strong password>'
apiVersion: v1
kind: Secret
metadata:
  name: aerobase-secrets
type: Opaque
stringData:
  JWT_SECRET: "change_me_super_secret"
  DB_PASSWORD: "postgres"
  STRIPE_SECRET_KEY: "replace_me"
  RAZORPAY_KEY_ID: "replace_me"
  RAZORPAY_KEY_SECRET: "replace_me"
