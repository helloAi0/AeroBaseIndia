apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerobase
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aerobase
  template:
    metadata:
      labels:
        app: aerobase
    spec:
      containers:
      - name: aerobase
        image: aerobaseindia/aerobase:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        - containerPort: 8443
        envFrom:
        - secretRef:
            name: aerobase-secrets
