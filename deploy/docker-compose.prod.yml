# Production stack. Usage (from the repo root):
#   cp deploy/.env.prod.example deploy/.env.prod   # then edit every value
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
# Migrations in ./migrations run automatically the FIRST time the database volume is created.
# For later schema changes apply new files with:  scripts/migrate.sh
name: aerobase
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aerobase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aerobase"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  ml_service:
    build: ../ml_service
    volumes:
      - mldata:/data
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      AEROBASE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aerobase
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      AUTH_DEV_RETURN_RESET_LINK: ${AUTH_DEV_RETURN_RESET_LINK:-}   # local only: show the reset link when no email provider is set
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_AIRPORT_CODE: ${WHATSAPP_AIRPORT_CODE:-}
      ML_SERVICE_URL: http://ml_service:5000
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL, e.g. https://api.example.com}
        VITE_SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-false}
        VITE_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mldata:
